<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* The social preview, 1200 x 630, rendered to public/og-image.png by design/make-og.py. Light theme, teal accent, the name as a block. */
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#f5f5f5;color:#0a0a0a;font:400 16px Geist,sans-serif;display:flex;align-items:center;gap:56px;padding:0 90px;overflow:hidden}
  .portrait{width:260px;height:260px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 8px #f5f5f5,0 0 0 12px #0d9488;flex:none}
  .portrait img{width:100%;height:100%;object-fit:cover;display:block}
  h1{display:inline-block;background:#0a0a0a;color:#f5f5f5;font-size:64px;line-height:1.05;letter-spacing:-.02em;font-weight:500;text-transform:uppercase;padding:.1em .3em .14em;border-radius:14px}
  .sub{margin-top:22px;font:400 20px "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#6b6b6b}
  .cmd{margin-top:26px;display:inline-flex;gap:14px;background:#ebebeb;border-radius:6px;padding:12px 18px;font:400 18px "Geist Mono",monospace;color:#3a3a3a}
  .cmd b{font-weight:400;color:#0d9488}
  .mark{position:absolute;right:90px;bottom:48px;display:flex;align-items:center;gap:12px;font:600 18px "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
</style></head>
<body>
  <div class="portrait"><img src="../public/portrait.jpg" alt=""></div>
  <div>
    <h1>Stanislav Plotnikov</h1>
    <div class="sub">Senior developer · Solution architect · Eindhoven</div>
    <div class="cmd"><span>&gt; whoami</span><b>modernization · automation · AI · security</b></div>
  </div>
  <div class="mark"><svg width="30" height="30" viewBox="0 0 48 48" fill="none"><rect x="4" y="4" width="40" height="40" rx="10" stroke="#0d9488" stroke-width="4" opacity=".35"/><path d="M15 17l8 7-8 7" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 31h8" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/></svg>splotnikov.dev</div>
</body></html>
