name: Security

# Every push already runs `composer audit` inside CI. This workflow runs only when the dependency files change and
# once a week (new advisories appear without any commit).
on:
  push:
    branches: [ main ]
    paths: [ 'composer.json', 'composer.lock' ]
  pull_request:
    paths: [ 'composer.json', 'composer.lock' ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit
        run: composer audit
