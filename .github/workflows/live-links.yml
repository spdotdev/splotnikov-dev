name: Live links

# Weekly crawl of the live site: every sitemap address answers 200 and names itself as canonical, every hreflang pair
# is reciprocal, every internal link resolves. The same checks run on the built app in the test suite on every push;
# this one catches what only the server can break (a deploy, a proxy rule, a missing asset).
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-live.py https://splotnikov.dev

  ui:
    # The browser checks that were run by hand: axe (WCAG 2.2 AA), sideways scroll at 360 px, keyboard focus, touch
    # targets and first button on a phone. Any finding fails the run. Run it by hand with "Run workflow".
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://splotnikov.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.64.0
          playwright install --with-deps chromium
      - name: Install axe-core
        run: |
          npm pack axe-core@4.10.2
          tar xzf axe-core-4.10.2.tgz
      - name: Page list from the sitemap
        run: |
          python3 - <<'PY' > paths.txt
          import re, urllib.request
          xml = urllib.request.urlopen('${{ env.SITE }}/sitemap.xml', timeout=30).read().decode()
          for u in re.findall(r'<loc>([^<]+)</loc>', xml):
              print(u.replace('${{ env.SITE }}', '') or '/')
          PY
          cat paths.txt
      - name: Axe, light and dark
        run: AXE_JS=package/axe.min.js python3 scripts/axe-check.py "$SITE" paths.txt
      - name: Sideways scroll at 360 px
        run: python3 scripts/overflow-check.py "$SITE" paths.txt
      - name: Keyboard focus
        run: python3 scripts/focus-check.py "$SITE" "$(paste -sd, paths.txt)"
      - name: Touch targets and first button
        run: python3 scripts/ui-check.py "$SITE"
      - name: Reflow at 320 px, also with the root font size at 150 percent
        run: REFLOW_SIZES=100%,150% python3 scripts/reflow-check.py "$SITE" paths.txt
      - name: Reflow at 390 and 1366 px with the root font size at 125 percent
        run: REFLOW_WIDTHS=390,1366 REFLOW_SIZES=125% python3 scripts/reflow-check.py "$SITE" paths.txt
      - name: Language switch on pages without a Dutch twin
        run: python3 scripts/switch-check.py "$SITE"
